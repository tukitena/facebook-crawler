schema_version: 1

school:
  name: "Trường Đại học Công nghệ Thông tin"
  aliases: ["UIT", "Đại học Công nghệ Thông tin", "ĐH CNTT"]

facebook:
  page_name: "UIT Confessions"
  page_url: "https://www.facebook.com/UITconfess"

chrome:
  executable_path: null # Auto-discover installed Google Chrome.
  user_data_dir: "runtime/chrome-profile" # Dedicated local profile only.
  headless: false
  login_attempts: 3

# Paths are relative to this config file, not the terminal directory.
paths:
  data_dir: "data/uit"
  raw_csv: "data/uit/raw/raw_posts.csv"
  processed_dir: "data/uit/processed"
  labeled_dir: "data/uit/labeled"
  reports_dir: "data/uit/reports"
  log_dir: "logs"

crawl:
  max_posts: 200 # Newly committed raw posts in this run.
  max_scrolls: 200
  no_progress_rounds: 8
  scroll_delay_seconds: 2
  feed_wait_timeout_seconds: 10
  navigation_timeout_seconds: 30
  action_timeout_seconds: 10
  blocked_resource_types: ["image", "media", "font"]
  service_workers: "block"

preprocess:
  marker_policy: line_start_numeric_v1
  separator_min_hyphens: 2
  require_marker: true
  short_content_chars: 10
  excluded_post_patterns: []
  overrides_csv: null

ollama:
  base_url: http://127.0.0.1:11434
  model: qwen3:8b
  temperature: 0
  seed: 42
  num_ctx: 8192
  num_predict: 512
  think: false
  keep_alive: 5m
  connect_timeout_seconds: 5
  read_timeout_seconds: 120
  write_timeout_seconds: 10
  pool_timeout_seconds: 5

classification:
  # Relative to this YAML file; adjust when placing the config elsewhere.
  prompt_path: src/classify/prompts/uit-impact-v1.txt
  max_attempts: 3
  review_threshold: 0.70
  max_content_utf8_bytes: 6000
  context_margin: 1024
  consecutive_service_failures: 3

logging:
  level: "INFO"
  max_bytes: 10485760
  backup_count: 3
